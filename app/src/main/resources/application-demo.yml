# Demo pública: PostgreSQL, datos ficticios que se reinician cada hora.
tratohecho:
  modo: demo
  licencia:
    limite-prueba: 100000

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tratohecho}
    username: ${DATABASE_USERNAME:tratohecho}
    password: ${DATABASE_PASSWORD:tratohecho}
  flyway:
    placeholders:
      id: BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      blob: BYTEA

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# Demo local con la misma configuración que la demo pública:  docker compose up --build  →  http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tratohecho
      POSTGRES_USER: tratohecho
      POSTGRES_PASSWORD: tratohecho
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tratohecho"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tratohecho
      DATABASE_USERNAME: tratohecho
      DATABASE_PASSWORD: tratohecho
    ports:
      - "8080:8080"

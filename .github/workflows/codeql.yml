name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lenguaje: java-kotlin
            modo: manual
          - lenguaje: javascript-typescript
            modo: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.lenguaje == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: ${{ matrix.modo }}
      - if: matrix.modo == 'manual'
        run: ./gradlew compileKotlin -PsinFrontend --no-build-cache --console=plain
      - uses: github/codeql-action/analyze@v3

name: Demo pública

# Publica la imagen en GitHub Container Registry y, si está configurado, avisa al hosting para desplegarla.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    env:
      CON_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/demo:latest,ghcr.io/${{ github.repository }}/demo:${{ github.sha }}
      - name: Desplegar (Render u otro hosting con deploy hook)
        env:
          DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
        if: env.CON_DEPLOY_HOOK == 'true'
        run: curl -fsS -X POST "$DEPLOY_HOOK"
